<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="icon" type="image/png" href="images/index/icon_192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="images/index/icon_192.png" sizes="192x192">
    <title>79King - Sân Chơi Đỉnh Cao Số 1 Việt Nam</title>
    <meta property="og:site_name" content="99OK">
    <meta name="google-site-verification" content="dIeRp9L8wwwkGyeYUoN_HqAqkQS-jtrONHyan1fjluU" />
    <link rel="canonical" href="https://79king1.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="79King - Sân Chơi Đỉnh Cao Số 1 Việt Nam" />
    <meta property="og:description" content="79King - Sân chơi giải trí uy tín, được đông đảo người chơi tin tưởng." />
    <meta property="og:image" content="https://79king1.pages.dev/images/index/icon_192.png"" />
    <meta property="og:url" content="https://79king1.pages.dev/" />
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "79king",
      "alternateName": "79king.com",
      "url": "https://79king1.pages.dev/"
    }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.min.js"></script>
    <script src="js/vue.js"></script>
    
    <style>
        @keyframes scaleEffect {
            0% {
                transform: scale(1.1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1.1);
            }
        }

        .img-download-app img {
            animation: scaleEffect 2s infinite ease-in-out;
        }

        .img-download-app {
            z-index: 99999;
        }

        .link-download-app {
            padding: 0px;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="header">
            <div class="hBox clearfix">
                <div class="logo">
                    <a href="index.html">
                        <img src="images/index/logo.png" alt="">
                    </a>
                </div>
                <div class="hIm02">
                    <a :href="kefuUrl" target="_blank">
                        <img src="images/index/cskh.png" alt="">
                    </a>
                </div>
            </div>
        </div>

        <!-- CAROUSEL MOBILE (1 hình / slide) -->
        <div class="sjbdmap">
            <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
                <div class="carousel-inner" v-if="banners.length > 0">
                    <div 
                        v-for="(img, idx) in banners" 
                        :key="idx" 
                        :class="['carousel-item', { active: idx === 0 }]"
                    >
                        <img :src="img" style="width: 100%">
                    </div>
                </div>
            </div>
        </div>

        <div id="container">
            <div id="main">
                <div class="wrap clearfix">
                    <div id="conts">
                        <h2><img src="images/index/Link truy cập tốc độ cao.png" alt=""></h2>
                        <ul class="linkUl">
                            <li class="li02" v-for="(item,index) in urls" :key="index">
                                <span class="txt">{{item.second}}</span>
                                <img src="images/index/index-icon.png" alt="">
                                <span class="web">{{item.title}}</span>
                                <a :href="item.url" target="_blank">Truy cập</a>
                            </li>
                        </ul>
                        <div class="refresh pcbdmap">
                            <a @click="refresh">TẢI LẠI</a>
                        </div>
                    </div>
                    <div id="sideBar">
                        <h2><img src="images/index/TẢI APP NGAY.png" alt=""></h2>
                        <div class="inner clearfix">
                            <div class="img-download-app">
                                <img src="images/index/748x828.png" alt="">
                            </div>

                            <div class="link-download-app">
                                <div class="content">
                                    <a @click="down" target="_blank">
                                        <img src="images/index/TẢI APP CHO DI ĐỘNG 2.png" style="width: 100%">
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="container2">
            <div id="main">
                <div class="wrap clearfix">
                    <div id="conts">
                        <h2><img src="images/index/Link truy cập tốc độ cao.png" alt=""></h2>
                        <ul class="linkUl">
                            <li class="li02" v-for="(item,index) in moburls" :key="index">
                                <span class="txt">{{item.second}}</span>
                                <img src="images/index/index-icon.png" alt="">
                                <span class="web">{{item.title}}</span>
                                <a :href="item.url" target="_blank">Truy cập</a>
                            </li>
                        </ul>
                        <div class="refresh pcbdmap">
                            <a @click="refresh">TẢI LẠI</a>
                        </div>
                        <div class="link-download-app">
                            <div class="content">
                                <a :href="apkAppUrl || 'https://79k09.club/DownloadApp/'" target="_blank">
                                    <img src="images/index/TẢI APP CHO DI ĐỘNG 2.png" style="width: 100%">
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CAROUSEL PC (2 hình / slide) -->
        <div id="containerlow">
            <div id="mainlow">
                <div class="wrap clearfix">
                    <div id="banner-pc-list">
                        <h2><img src="images/index/TIN TỨC SỰ KIỆN.png" alt="Tin tức sự kiện"></h2>
                        <div id="doubleBannerCarousel" class="carousel slide" data-ride="carousel" data-interval="5000">

                            <div class="carousel-inner double-slide-inner" v-if="banners.length > 0">
                                <div 
                                    v-for="(pair, idx) in groupedBanners" 
                                    :key="idx" 
                                    :class="['carousel-item', { active: idx === 0 }]"
                                >
                                    <div class="double-banner-group">
                                        <div v-for="(img, imgIdx) in pair" :key="imgIdx" class="banner-item">
                                            <img :src="img" style="width: 100%">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <a class="carousel-control-prev" href="#doubleBannerCarousel" role="button" data-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="sr-only">Previous</span>
                            </a>
                            <a class="carousel-control-next" href="#doubleBannerCarousel" role="button" data-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="sr-only">Next</span>
                            </a>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="container-social">
            <div id="main-social">
                <div class="wrap clearfix">

                    <h2><img src="images/index/KẾT NỐI MẠNG XÃ HỘI.png" alt="Kết nối mạng xã hội"></h2>

                    <div class="social-links-container">

                        <div class="social-item">
                            <a :href="socialLinks.facebookUrl" target="_blank">
                                <img src="images/index/facebook-icon.png" alt="Fanpage Facebook">
                                <span>Fanpage Facebook</span>
                            </a>
                        </div>

                        <div class="social-item">
                            <a :href="socialLinks.telegramUrl" target="_blank">
                                <img src="images/index/telegram-icon.png" alt="Kênh Telegram">
                                <span>Kênh Telegram</span>
                            </a>
                        </div>

                        <div class="social-item special-link">
                            <a :href="socialLinks.giftcodeUrl" target="_blank">
                                <img src="images/index/giftcode-icon.png" alt="Link nhập Code">
                                <span>Link nhập Code</span>
                            </a>
                        </div>

                        <div class="social-item">
                            <a :href="socialLinks.dailyTelegramUrl" target="_blank">
                                <img src="images/index/telegram-icon.png" alt="Chuyên viên Đại Lý">
                                <span>Chuyên viên Đại Lý</span>
                            </a>
                        </div>

                        <div class="social-item">
                            <a :href="socialLinks.agentLoginUrl" target="_blank">
                                <img src="images/index/agent.png" alt="Đăng nhập Đại Lý">
                                <span>Đăng nhập Đại Lý</span>
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div id="footer">
            <div class="fBox">
                <div class="fImg">
                </div>
                <p>Copyright © 79KING.COM Reserved</p>
            </div>
        </div>
    </div>
    
    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/main-app.js"></script>

</body>

</html>
